<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Urdu Sukhan</title>

  <!-- Google Fonts (optional fallback) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    @font-face {
      font-family: 'Amar Nastaleeq';
      src: url('fonts/AmarNastaleeq.ttf') format('truetype');
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6fa;
      padding: 20px;
      width: 300px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #666;
      text-align: center;
    }

    #downloadBtn {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    #downloadBtn:hover {
      background-color: #0056b3;
    }

    .urdu-text {
      font-family: 'Amar Nastaleeq', serif;
      direction: rtl;
      font-size: 20px;
      text-align: right;
      line-height: 2;
      margin-top: 20px;
      color: #000;
    }
      @font-face {
    font-family: 'Amar Nastaleeq';
    src: url('fonts/AmarNastaleeq.ttf') format('truetype');
  }

  #word-text {
    font-family: 'Amar Nastaleeq', serif !important;
    font-size: 24px !important;
    direction: rtl;
  }
  </style>

  <script defer src="popup.js"></script>
</head>
<body>
  <h2>Urdu Sukhan</h2>
  <p>Click below to download your saved translations</p>
  <button id="downloadBtn">Download Notes</button>

  <div class="urdu-text">
    یہ ایک مثال ہے۔
  </div>
</body>
</html>
